<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Лабораторные стенды «Электрический привод»</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- only light: запрет браузеру (Chrome Android «Auto Dark Theme») перекрашивать стенд в тёмную тему -->
<meta name="color-scheme" content="only light">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
  <div class="brand">
    <h1>Лабораторные стенды «Электрический привод»</h1>
    <span class="version" id="version" title="Дата и время коммита"></span>
  </div>
  <nav class="bench-tabs" id="bench-tabs">
    <button data-bench="dc">Стенд ДПТ <small>шкафы А1–А6</small></button>
    <button data-bench="ac">Стенд АД <small>шкафы Б1–Б6</small></button>
  </nav>
  <button id="btn-menu" class="tb menu-btn" title="Действия со схемой" aria-label="Меню">⋯</button>
  <div class="toolbar" id="toolbar">
    <button id="btn-check" class="tb" title="Статическая проверка собранной схемы">Проверить схему</button>
    <button id="btn-clear" class="tb" title="Удалить все провода">Снять провода</button>
    <button id="btn-save" class="tb" title="Сохранить схему в файл">Сохранить</button>
    <label class="tb file-label" title="Загрузить схему из файла">Загрузить<input id="file-load" type="file" accept=".json" hidden></label>
    <div class="wire-colors" id="wire-colors" title="Цвет провода"></div>
  </div>
</header>

<!-- миникарта стенда и переключение зон (только на узких экранах) -->
<nav id="minimap" class="minimap"></nav>

<div id="app-outer">
<main id="app">
  <!-- ряд шкафов (вид спереди, слева направо как на стенде) -->
  <section class="bench" id="bench">
    <div class="cabinet cab-rest" id="cab-rest" title="Шкафы автоматики стенда: органов управления для студента нет">
      <div class="cab-no" id="no-rest"></div>
      <div class="cab-window tall"></div>
      <div class="rest-note">автоматика стенда</div>
    </div>
    <div class="cabinet cab-pc" id="cab-pc">
      <div class="cab-no" id="no-pc"></div>
      <div class="cab-window"></div>
      <div class="pc-monitor">
        <div class="pc-screen">
          <div class="pc-bar"><span>Диагностика стенда</span><button id="btn-log-clear" class="mini">очистить</button></div>
          <div id="log" class="log"></div>
        </div>
        <div class="pc-stand"></div>
      </div>
      <div class="pc-desk"><div class="pc-keyboard"></div><div class="pc-mouse"></div></div>
    </div>

    <div class="cabinet cab-conv" id="cab-conv">
      <div class="cab-no" id="no-conv"></div>
      <div class="cab-window"></div>
      <div id="converters-conv" class="conv-stack"></div>
      <div class="cab-window bottom"></div>
    </div>

    <div class="cabinet cab-field" id="cab-field">
      <div class="cab-no" id="no-field"></div>
      <div class="inputs-row" id="inputs-row">
        <div id="pw-slot"></div>
        <div id="power-inputs"></div>
      </div>
      <div class="meters-block" id="meters-block">
        <div id="meters-panel"></div>
        <div id="pw-slot-right"></div>
      </div>
      <button id="btn-field" class="field-door" title="Показать или скрыть наборное поле с клеммниками и проводами">
        <div class="fd-preview" id="fd-preview"></div>
        <div class="fd-glass"></div>
        <div class="fd-handle"></div>
        <div class="fd-label"><b id="ft-title">Открыть наборное поле</b><small id="ft-sub">монтажный отсек за стеклянной дверью</small></div>
      </button>
      <div id="field-controls" class="field-controls"></div>
    </div>

    <div class="cabinet cab-power" id="cab-power">
      <div class="cab-no" id="no-power"></div>
      <div id="power-top"></div>
      <div id="converters-power" class="conv-stack"></div>
    </div>

    <div class="table-top"></div>
    <div class="base base-left"><div class="perf"></div></div>
    <div class="base base-motors">
      <div class="base-title">Двухмашинный агрегат</div>
      <div id="motors"></div>
    </div>
  </section>

  <!-- монтажный отсек крупно (раскрывается кнопкой-дверью в шкафу) -->
  <section class="cab-row cab-row-field">
    <div class="cabinet cabinet-field">
      <div class="cabinet-title">
        <span id="field-title">Монтажный отсек (наборное поле)</span>
        <span class="door-state" id="door-state"></span>
        <span class="zoom-ctl"><button id="zoom-out" title="Уменьшить">−</button><button id="zoom-fit" title="По ширине">100%</button><button id="zoom-in" title="Увеличить">+</button></span>
        <button id="btn-door" class="door-btn"></button>
        <button id="btn-wire-del" class="door-btn wire-del" title="Удалить выбранный провод">Удалить провод</button>
        <button id="btn-field-close" class="door-btn" title="Свернуть увеличенный вид">Свернуть ▴</button>
      </div>
      <div id="field-panel" class="field-panel"></div>
    </div>
    <aside class="side">
      <div class="cabinet cabinet-log">
        <div class="cabinet-title">Диагностика <button id="btn-log-clear2" class="mini">очистить</button></div>
        <div id="log2" class="log"></div>
      </div>
    </aside>
  </section>
</main>
</div>

<div id="hint" class="hint"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
